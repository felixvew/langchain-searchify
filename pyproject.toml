[project]
name = "langchain-searchify"
version = "0.1.0"
description = "LangChain tools for searchify: keyless web search, clean page text and local reranking."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.0",
    "pydantic>=2",
    # searchify is not on PyPI yet, so it is pinned to a commit of its GitHub repo
    "searchify @ git+https://github.com/sami-mag07/searchify-l@4adb85270781bd4226c644e4dcfdd1b79979b2c3",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0"]

[dependency-groups]
test = ["pytest>=8", "langchain-tests>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
