[project]
name = "langchain-searchify"
version = "0.1.0"
description = "LangChain tools for searchify: keyless web search, clean page text and local reranking."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.0",
    "pydantic>=2",
    "searchify>=0.3.0,<0.4",
]

[project.optional-dependencies]
rerank = ["searchify[rerank]>=0.3.0,<0.4"]

[dependency-groups]
test = ["pytest>=8", "langchain-tests>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
