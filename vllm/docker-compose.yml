services:
  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    ports:
      - "8001:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}   # set HF_HUB_OFFLINE=1 in .env once the model is downloaded
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model ${VLLM_MODEL}
      --reasoning-parser qwen3
      --host 0.0.0.0
      --port 8000
      --max-model-len -1
      --gpu-memory-utilization 0.86
      --enforce-eager
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --kv-cache-dtype fp8
      --kv-transfer-config '{
          "kv_connector": "OffloadingConnector",
          "kv_role": "kv_both",
          "kv_connector_extra_config": {
            "block_size": 64,
            "cpu_bytes_to_use": 1000000000
          }
        }'
    # cpu-offload-gb # This offloads 2gb fun den Model Parameter fum VRAM op den RAM (pro: mei kv cache token length besser fir lànger prompts. cons: mei lues tok/s) 
    # kv-cache-dtype fp8
    # port under command is where the vllm server listens, needs to be the backend port
    # added the reasoning parser: this handles the seperation of reasoning from the actual answer (content), allowing the openaiapi endpoint to discard it. 
    # This means reasoning tokens get never stored in the checkpointer, which is the correct behaviour.
volumes:
  huggingface-cache: